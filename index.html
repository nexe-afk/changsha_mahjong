<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>长沙红中麻将 🀄</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1f0d;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    #game-canvas { display: block; }
    #loading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f1c40f;
      font-size: 24px;
      background: #0d1f0d;
      z-index: 100;
    }
  </style>
</head>
<body>
  <div id="loading">🀄 加载中...</div>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.1.0/dist/pixi.min.js"></script>

  <!-- 核心逻辑（纯算法） -->
  <script src="js/core.js"></script>
  <script src="js/hu.js"></script>
  <script src="js/rule.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/difficulty.js"></script>
  <script src="js/ai_logger.js"></script>

  <!-- 引擎层：按依赖顺序加载 -->
  <script src="engine/sound.js"></script>
  <script src="engine/tile.js"></script>
  <script src="engine/animation.js"></script>
  <script src="engine/renderer.js"></script>
  <script src="engine/scenes.js"></script>
  <script src="engine/flow.js"></script>
  <script src="engine/game_engine.js"></script>

  <!-- 增强模块 -->
  <script src="js/gamefeel.js"></script>
  <script src="js/tutorial.js"></script>

  <script>
    document.getElementById('loading').textContent = '🎮 启动中...';
    window.addEventListener('load', async () => {
      const app = new PIXI.Application();
      await app.init({
        width: 1200,
        height: 800,
        backgroundColor: 0x0d1f0d,
        antialias: true,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true,
      });
      document.getElementById('game-canvas')?.remove();
      document.getElementById('loading')?.remove();
      const canvas = app.canvas;
      canvas.id = 'game-canvas';
      document.body.appendChild(canvas);

      const engine = new GameEngine(app);
      engine.init();
      engine.start();

      // 初始化动态难度
      if (typeof DDAManager !== 'undefined') DDAManager.init();

      // 首次启动引导
      if (typeof TutorialManager !== 'undefined') {
        setTimeout(() => TutorialManager.maybeStart(), 800);
      }
    });
  </script>
</body>
</html>
