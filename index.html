<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>长沙红中麻将</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 顶部：玩家3 & 玩家4 -->
    <div id="top-bar">
      <div class="player-info" id="player3-info">
        <span class="player-name">🤖 上家</span>
        <span class="player-score">0</span>
        <div class="hand-back" id="player3-hand"></div>
        <div class="melon-area" id="player3-melons"></div>
        <div class="discard-area" id="player3-discards"></div>
      </div>
      <div class="player-info" id="player4-info">
        <span class="player-name">🤖 对家</span>
        <span class="player-score">0</span>
        <div class="hand-back" id="player4-hand"></div>
        <div class="melon-area" id="player4-melons"></div>
        <div class="discard-area" id="player4-discards"></div>
      </div>
    </div>

    <!-- 中间区域 -->
    <div id="center-area">
      <div id="game-status">长沙红中麻将 🀄</div>
      <div id="timer-bar">
        <div id="timer-fill"></div>
      </div>
      <div id="action-panel">
        <button class="action-btn" id="btn-hu" disabled>胡</button>
        <button class="action-btn" id="btn-peng" disabled>碰</button>
        <button class="action-btn" id="btn-gang" disabled>杠</button>
        <button class="action-btn" id="btn-pass" disabled>过</button>
      </div>
      <div id="last-discard-area"></div>
    </div>

    <!-- 左侧：玩家2 -->
    <div id="left-bar">
      <div class="player-info" id="player2-info">
        <span class="player-name">🤖 下家</span>
        <span class="player-score">0</span>
        <div class="hand-back" id="player2-hand"></div>
        <div class="melon-area" id="player2-melons"></div>
      </div>
    </div>

    <!-- 底部：玩家1（你） -->
    <div id="bottom-bar">
      <div class="player-info" id="player1-info">
        <span class="player-name">🧑 你</span>
        <span class="player-score">0</span>
      </div>
      <div class="melon-area" id="player1-melons"></div>
      <div id="hand-area" id="player1-hand"></div>
    </div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/hu.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/rule.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
